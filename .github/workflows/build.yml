
name: Build and Release AAB

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract project
        run: unzip -q unsee.zip

      - name: Find project directory
        run: |
          SETTINGS_FILE=$(find . -name settings.gradle.kts -not -path '*/.gradle/*' -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found"
            find . -maxdepth 4 -type f | head -100
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Remove invalid font README
        run: |
          rm -f "$PROJECT_DIR/app/src/main/res/font/README.txt"

      - name: Prepare signing key
        run: |
          echo "${{ secrets.UNSEE_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/unsee-upload-key.jks"

      - name: Verify signing secrets
        run: |
          test -s "$RUNNER_TEMP/unsee-upload-key.jks"
          test -n "${{ secrets.UNSEE_KEYSTORE_PASSWORD }}"
          test -n "${{ secrets.UNSEE_KEY_ALIAS }}"
          test -n "${{ secrets.UNSEE_KEY_PASSWORD }}"

      - name: Build APK and AAB
        env:
          UNSEE_KEYSTORE_FILE: ${{ runner.temp }}/unsee-upload-key.jks
          UNSEE_KEYSTORE_PASSWORD: ${{ secrets.UNSEE_KEYSTORE_PASSWORD }}
          UNSEE_KEY_ALIAS: ${{ secrets.UNSEE_KEY_ALIAS }}
          UNSEE_KEY_PASSWORD: ${{ secrets.UNSEE_KEY_PASSWORD }}
        run: |
          cd "$PROJECT_DIR"
          gradle testDebugUnitTest assembleDebug bundleRelease --no-daemon --stacktrace

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: unsee-play-store-release
          path: |
            **/app/build/outputs/apk/debug/app-debug.apk
            **/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
